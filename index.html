<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端Hardy</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffccd5;
            color: #fff;
            font-family: 'Indie Flower', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        /* 保持原有定位结构 */
        .flower {
            position: relative;
            width: 60px;
            height: 220px;
            margin-top: -50px;
        }

        .flower .petal {
            position: absolute;
            background-color: #d52d58;
            border-radius: 0px 30px 0px 30px;
            width: 30px;
            height: 60px;
        }

        /* 保持原始定位参数 */
        .flower .petal:nth-child(1) {
            left: -10px;
            transform: rotate(-5deg); /* 初始角度更小 */
            transform-origin: bottom right;
            background-color: #b81b43;
            animation: openleft 3s ease-in forwards;
            z-index: 5;
        }

        .flower .petal:nth-child(2) {
            left: -10px;
            background-color: #c9204b;
            z-index: 4;
        }

        .flower .petal:nth-child(3) {
            border-radius: 30px;
            left: 5px;
        }

        .flower .petal:nth-child(4) {
            border-radius: 30px 0px 30px 0px;
            background-color: #c9204b;
            left: 20px;
            z-index: 4;
        }

        .flower .petal:nth-child(5) {
            border-radius: 30px 0px 30px 0px;
            left: 20px;
            transform: rotate(5deg); /* 初始角度更小 */
            transform-origin: bottom left;
            animation: openright 3s ease-in forwards;
            background-color: #b81b43;
            z-index: 5;
        }

        /* 保持花杆原始定位 */
        .flower .rod {
            background-color: #329932;
            width: 5px;
            height: 150px;
            position: absolute;
            left: 17.5px;
            top: 58px;
            z-index: -1;
        }

        .flower .rod::before {
            background-color: lightgreen;
            border-radius: 3px;
            content: '';
            display: block;
            width: 20px;
            height: 8px;
            margin-left: -8px;
        }

        .flower .rod .spike {
            width: 0;
            height: 0;
            position: absolute;
            top: 20px;
            left: -10px;
            border-color: transparent #329932 transparent transparent;
            border-style: solid;
            border-width: 5px;
        }

        .flower .rod .spike:nth-child(2) {
            top: 50px;
            left: 4px;
            border-color: transparent transparent transparent #329932;
        }

        .flower .rod .spike:nth-child(3) {
            top: 80px;
        }

        .flower .rod .spike:nth-child(4) {
            top: 110px;
            left: 4px;
            border-color: transparent transparent transparent #329932;
        }

        /* 仅修改动画参数 */
        @keyframes openleft {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(-20deg); }
        }

        @keyframes openright {
            0% { transform: rotate(5deg); }
            100% { transform: rotate(20deg); }
        }

        /* 同步文字动画时间 */
        .text-container {
            position: absolute;
            top: calc(50% + 150px);
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s 3.5s forwards; /* 延迟调整为3.5秒 */
        }

        .text {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            font-size: 24px;
            color: #d52d58;
            border-right: 2px solid transparent;
            animation: 
                typing 2s steps(7) 3.5s forwards,
                blinkCaret 0.5s step-end 3.5s 6;
        }

        @keyframes fadeIn {
            from { opacity: 0 }
            to { opacity: 1 }
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 200px }
        }

        @keyframes blinkCaret {
            from, to { border-color: transparent }
            50% { border-color: #d52d58 }
        }
    </style>
</head>
<body>
    <div class="flower">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="rod">
            <div class="spike"></div>
            <div class="spike"></div>
            <div class="spike"></div>
            <div class="spike"></div>
        </div>
    </div>
    
    <div class="text-container">
        <div class="text">蒋文宇</div>
    </div>
</body>
</html>
